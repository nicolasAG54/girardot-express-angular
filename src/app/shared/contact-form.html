<form class="contact-form" [formGroup]="form" (ngSubmit)="openWhatsApp()" novalidate>
  <div class="field-row">
    <label>
      <span>Nombre completo</span>
      <input
        type="text"
        formControlName="name"
        id="contact-name"
        autocomplete="name"
        required
        aria-required="true"
        placeholder="¿Cómo te llamas?"
        [attr.aria-invalid]="submitted() && form.controls.name.invalid ? 'true' : null"
        [attr.aria-describedby]="submitted() && form.controls.name.invalid ? 'contact-name-error' : null"
      />
      @if (submitted() && form.controls.name.invalid) {
        <small id="contact-name-error" role="alert">Escribe tu nombre.</small>
      }
    </label>

    <label>
      <span>Teléfono</span>
      <input
        type="tel"
        formControlName="phone"
        id="contact-phone"
        autocomplete="tel"
        required
        aria-required="true"
        placeholder="Tu número de contacto"
        [attr.aria-invalid]="submitted() && form.controls.phone.invalid ? 'true' : null"
        [attr.aria-describedby]="submitted() && form.controls.phone.invalid ? 'contact-phone-error' : null"
      />
      @if (submitted() && form.controls.phone.invalid) {
        <small id="contact-phone-error" role="alert">Escribe un número de contacto.</small>
      }
    </label>
  </div>

  <label>
    <span>Correo electrónico</span>
    <input
      type="email"
      formControlName="email"
      id="contact-email"
      autocomplete="email" required aria-required="true"
      placeholder="nombre@correo.com"
      [attr.aria-invalid]="submitted() && form.controls.email.invalid ? 'true' : null"
      [attr.aria-describedby]="submitted() && form.controls.email.invalid ? 'contact-email-error' : null"
    />
    @if (submitted() && form.controls.email.invalid) {
      <small id="contact-email-error" role="alert">Escribe un correo electrónico válido.</small>
    }
  </label>

  @if (context === 'commercial') {
    <fieldset class="commercial-fields"><legend>Acerca de tu negocio</legend><div class="field-row"><label><span>Empresa o marca</span><input id="contact-company" formControlName="company" type="text" autocomplete="organization" placeholder="Nombre de tu negocio" required aria-required="true" [attr.aria-invalid]="submitted() && form.controls.company.invalid ? 'true' : null" [attr.aria-describedby]="submitted() && form.controls.company.invalid ? 'contact-company-error' : null" />@if (submitted() && form.controls.company.invalid) {<small id="contact-company-error" role="alert">Completa este campo.</small>}</label>
<label><span>Cargo</span><input id="contact-role" formControlName="role" type="text" autocomplete="organization-title" placeholder="Tu rol en la empresa" required aria-required="true" [attr.aria-invalid]="submitted() && form.controls.role.invalid ? 'true' : null" [attr.aria-describedby]="submitted() && form.controls.role.invalid ? 'contact-role-error' : null" />@if (submitted() && form.controls.role.invalid) {<small id="contact-role-error" role="alert">Completa este campo.</small>}</label>
<label><span>Categoría del negocio</span><input id="contact-category" formControlName="category" type="text" autocomplete="off" placeholder="Ej. moda, gastronomía, salud" required aria-required="true" [attr.aria-invalid]="submitted() && form.controls.category.invalid ? 'true' : null" [attr.aria-describedby]="submitted() && form.controls.category.invalid ? 'contact-category-error' : null" />@if (submitted() && form.controls.category.invalid) {<small id="contact-category-error" role="alert">Completa este campo.</small>}</label>
<label><span>Área requerida</span><input id="contact-area" formControlName="area" type="text" autocomplete="off" placeholder="Ej. 60 m² o necesito orientación" required aria-required="true" [attr.aria-invalid]="submitted() && form.controls.area.invalid ? 'true' : null" [attr.aria-describedby]="submitted() && form.controls.area.invalid ? 'contact-area-error' : null" />@if (submitted() && form.controls.area.invalid) {<small id="contact-area-error" role="alert">Completa este campo.</small>}</label>
</div></fieldset>
  }
  <label>
    <span>¿Qué te interesa?</span>
    <select
      formControlName="interest"
      id="contact-interest"
      required
      aria-required="true"
      [attr.aria-invalid]="submitted() && form.controls.interest.invalid ? 'true' : null"
      [attr.aria-describedby]="submitted() && form.controls.interest.invalid ? 'contact-interest-error' : null"
    >
      <option value="" disabled>Selecciona una opción</option>
      @if (context === 'commercial') {
        <option value="Local comercial">Local comercial</option>
        <option value="Isla comercial">Isla comercial</option>
        <option value="Portafolio comercial">Portafolio comercial</option>
        <option value="Planos y disponibilidad">Planos y disponibilidad</option>
        <option value="Gastronomía">Gastronomía</option>
        <option value="Servicios o bienestar">Servicios o bienestar</option>
        <option value="Alianza comercial">Alianza comercial</option>
      } @else {
        <option value="Información general">Información general</option>
        <option value="Cómo llegar">Cómo llegar</option>
        <option value="Trabajar con nosotros">Trabajar con nosotros</option>
        <option value="Espacios comerciales">Espacios comerciales</option>
      }
    </select>
    @if (submitted() && form.controls.interest.invalid) {
      <small id="contact-interest-error" role="alert">Selecciona una opción.</small>
    }
  </label>

  <label>
    <span>Cuéntanos un poco más</span>
    <textarea
      formControlName="message"
      id="contact-message"
      rows="4"
      required
      aria-required="true"
      placeholder="Escribe aquí tu consulta"
      [attr.aria-invalid]="submitted() && form.controls.message.invalid ? 'true' : null"
      [attr.aria-describedby]="submitted() && form.controls.message.invalid ? 'contact-message-error' : null"
    ></textarea>
    @if (submitted() && form.controls.message.invalid) {
      <small id="contact-message-error" role="alert">Escribe un mensaje breve.</small>
    }
  </label>

  <label class="consent">
    <input
      type="checkbox"
      formControlName="consent"
      id="contact-consent"
      required
      aria-required="true"
      [attr.aria-invalid]="submitted() && form.controls.consent.invalid ? 'true' : null"
      [attr.aria-describedby]="submitted() && form.controls.consent.invalid ? 'contact-consent-error' : null"
    />
    <span>Acepto que mis datos sean usados para responder esta solicitud.</span>
  </label>
  @if (submitted() && form.controls.consent.invalid) {
    <small id="contact-consent-error" class="consent-error" role="alert">Necesitamos tu autorización para continuar.</small>
  }

  <button class="button button-primary" type="submit">Continuar por WhatsApp</button>
  <p class="form-note">Se abrirá WhatsApp con tu consulta preparada. Allí podrás revisarla y enviarla al equipo.</p>
</form>
