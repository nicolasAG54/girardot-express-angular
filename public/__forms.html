<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="netlify-form-registry" content="contact"><title>Formularios de contacto</title></head>
<body>
<!-- Static schemas for Netlify's build-time parser; keep field names aligned with ContactForm.send. -->
<form name="contacto-general" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="form-name" value="contacto-general"><input name="subject">
  <input name="name"><input name="phone"><input type="email" name="email">
  <input name="interest"><textarea name="message"></textarea><input name="bot-field">
  <input name="authorization"><input name="authorization-version"><input name="authorized-at"><input name="page">
</form>
<form name="espacios-comerciales" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="form-name" value="espacios-comerciales"><input name="subject">
  <input name="name"><input name="phone"><input type="email" name="email">
  <input name="company"><input name="role"><input name="category"><input name="area">
  <input name="interest"><textarea name="message"></textarea><input name="bot-field">
  <input name="authorization"><input name="authorization-version"><input name="authorized-at"><input name="page">
</form>
</body></html>
